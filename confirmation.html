<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>
    <link rel="stylesheet" href="style/confirmation.css">
</head>
<body>
    <div id="confirmation-container">
        <div class="confirmation-box">
            <h1>Booking Confirmed!</h1>
            <p>Thank you for your purchase. Here are your booking details:</p>
            <p id="email-message" class="email-confirmation"></p>

            <div id="booking-summary" class="summary-box"></div>

            <div class="actions">
                <button onclick="window.print()">Print Details</button>
                <button onclick="location.href='index.html'" class="home-btn">Back to Home</button>
            </div>
        </div>
    </div>
    

    <script src="js/confirmation.js" type="module"></script>
</body>
</html>
