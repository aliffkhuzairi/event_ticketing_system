<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventure</title>
    <link rel="stylesheet" href="style/details.css">
    <link rel="stylesheet" href="style/chatbot.css">   
</head>
<body>
    <div id="headerPlaceholder"></div>
    <main>
        <section class="img-banner">
            <div class="img"></div>
        </section>
        <section class="hero">
            <div class="container">
     
                <div class="evento">
                    <div class="event-details">
                        <div class="event-title"></div>
                        <div class="event-info">
                            <!-- <div class="other">
                                <p><strong>Date:</strong> ${displayDate}</p>
                                <p><strong>Venue:</strong> ${event.venue}</p>
                                <p><strong>Location:</strong> ${event.location}</p>
                                <p><strong>Price:</strong> ${event.price ? `${event.price} KRW` : 'Free Event'}</p>            
                                <p><strong>Event Information:</strong></p>
                                <p>${event.eventInfo}</p>
                                <p><strong>Description:</strong></p>
                                <p>${event.eventDescription}</p>
                            </div> -->
                        </div>
                    </div>
                </div>              
                <div class="buy-ticket">
                    <div class="price-container">
                        
                    </div>
                    <div class="btn">  
                        <!-- <button id="confirm-booking">Buy Ticket</button> -->
                    </div>
                </div>
            </div>
            
            <div class="calendar">
                <h3>Select Date</h3>
                <div class="date-container">
                    <div id="date-buttons" class="date-selection"></div>
                </div>
            </div> 
        </section>

        <section class="tab-container">
            <div class="wrap">
                <div class="tab-box">
                    <h3 class="active" id="desc-tab">Description</h3>
                    <h3 id="info-tab">Info</h3>
                </div>
                <div class="tab-content">
                    <!-- <div class="active" id=desc-content>
                        <h3>Description</h3>
                        <p>${event.eventDescription}</p>
                    </div>
                    <div id=info-content>
                        <h3>Info</h3>
                        <p>${event.eventInfo}</p> 
                    </div>   -->
                </div>
            </div>
            
        </section>
        
    </main>
    <div id="chatbot-container" class="chatbot-container">
        <div class="chatbot-header">
            <span>Chatbot</span>
            <button id="chatbot-close-btn">&times;</button>
        </div>
        <div id="chatbot-body" class="chatbot-body">
            <div class="chatbot-messages" id="chatbot-messages"></div>
            <div class="chatbot-input-container">
                <input type="text" id="chatbot-input" placeholder="Type your message..." />
                <button id="chatbot-send-btn">Send</button>
            </div>
        </div>
    </div>
    <button id="chatbot-toggle-btn" class="chatbot-toggle-btn">💬</button>
    <script type ="module" src="js/detail.js"></script>
    <script src="js/header.js"></script>
    <script src="js/chatbot.js" defer></script>
</body>
</html>
