<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="style/result.css">
    <link rel="stylesheet" href="style/chatbot.css">   
</head>
<body>
    <div id="headerPlaceholder"></div>
    <main>
        <section class="filter-container">
            <button id="toggleFilters" class="toggle-filters" style="display: none;">Filters</button>
            <div class="filters-content" id="filtersContent">
                <button id="closeFilters" class="close-filters" >&#10006;</button>
                <div class="filters">
                    <label>Price Range:</label>
                    <input id="filterPriceMin" type="number" placeholder="Min">
                    <input id="filterPriceMax" type="number" placeholder="Max">
        
                    <label for="filterDate">Date:</label>
                    <input id="filterDate" type="date">
        
                    <label for="filterSeatType">Seating:</label>
                    <select id="filterSeatType">
                        <option value="">All</option>
                        <option value="true">Seated</option>
                        <option value="false">Non-Seated</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button id="applyFilters" class="btn apply">Apply Filters</button>
                    <button id="resetFilters" class="btn reset">Reset Filters</button>
                </div>
                <div class="sorting">
                    <label for="sortSelector">Sort By:</label>
                    <select id="sortSelector">
                        <option value="default">Date</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="location-asc">Location: A-Z</option>
                        <option value="location-desc">Location: Z-A</option>
                        <option value="alphabetical-asc">Title: A-Z</option>
                        <option value="alphabetical-desc">Title: Z-A</option>
                    </select>
                </div>
            </div>
            <div id="filterOverlay" class="filter-overlay"></div>
        </section>
        <div class="results-count" id="resultsCount"></div>
        <div class="no-result" id="noResultMessage"style="display: none;">No events found. Try another search.</div>
        <section id="resultsContainer" class="results-container"></section>
        
    </main>
    <div id="footerPlaceholder"></div>
    <div id="chatbot-container" class="chatbot-container">
        <div class="chatbot-header">
            <span>Chatbot</span>
            <button id="chatbot-close-btn">&times;</button>
        </div>
        <div id="chatbot-body" class="chatbot-body">
            <div class="chatbot-messages" id="chatbot-messages"></div>
            <div class="chatbot-input-container">
                <input type="text" id="chatbot-input" placeholder="Type your message..." />
                <button id="chatbot-send-btn">Send</button>
            </div>
        </div>
    </div>
    <button id="chatbot-toggle-btn" class="chatbot-toggle-btn">💬</button>

    <script type="module" src="/js/result.js"></script>
    <script src="/js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/chatbot.js" defer></script>
</body>
</html>
